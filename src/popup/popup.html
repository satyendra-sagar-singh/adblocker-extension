<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Ad Blocker</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <div class="brand">
        <img src="../icons/icon-32.png" alt="" width="20" height="20" />
        <span class="brand-name">Ad Blocker</span>
      </div>
      <div class="header-actions">
        <button class="icon-button" id="options-button" type="button" title="Settings" aria-label="Open settings">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
            <path fill="currentColor" d="M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65a.5.5 0 0 0 .12-.64l-2-3.46a.5.5 0 0 0-.61-.22l-2.49 1a7.3 7.3 0 0 0-1.69-.98l-.38-2.65A.49.49 0 0 0 14 2h-4a.49.49 0 0 0-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1a.5.5 0 0 0-.61.22l-2 3.46a.5.5 0 0 0 .12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65a.5.5 0 0 0-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.04.24.25.42.49.42h4c.24 0 .45-.18.49-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46a.5.5 0 0 0-.12-.64l-2.11-1.65ZM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7Z"/>
          </svg>
        </button>
        <label class="switch" title="Enable or disable blocking everywhere">
          <input type="checkbox" id="global-toggle" />
          <span class="slider"></span>
        </label>
      </div>
    </header>

    <main class="content">
      <section class="site" id="site-section" hidden>
        <div class="site-row">
          <div>
            <div class="site-label" id="site-status-label">Blocking on</div>
            <div class="site-host" id="site-host"></div>
          </div>
          <label class="switch" title="Pause blocking on this site">
            <input type="checkbox" id="site-toggle" />
            <span class="slider"></span>
          </label>
        </div>
        <button class="link-button" id="reload-button" hidden>Reload page to apply</button>
      </section>

      <section class="site" id="no-site-section" hidden>
        <p class="muted">Blocking does not apply to this page.</p>
      </section>

      <section class="stats">
        <div class="stat">
          <div class="stat-value" id="stat-blocked">–</div>
          <div class="stat-label">Blocked on this tab</div>
        </div>
        <div class="stat">
          <div class="stat-value" id="stat-youtube">0</div>
          <div class="stat-label">YouTube ads skipped</div>
        </div>
        <div class="stat">
          <div class="stat-value" id="stat-hidden">0</div>
          <div class="stat-label">Elements hidden</div>
        </div>
      </section>

      <p class="paused-banner" id="paused-banner" hidden>Blocking is turned off everywhere.</p>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
